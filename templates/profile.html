{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <h2 style="margin-bottom: 1.5rem; border-bottom: 2px solid var(--light-grey); padding-bottom: 0.5rem;">
        My Profile
    </h2>
    
    <div style="display: flex; flex-direction: column; gap: 1rem; font-size: 1.05rem;">
        <div>
            <span style="color: var(--text-grey); font-weight: 600; display: inline-block; width: 100px;">SRN:</span> 
            <strong>{{ user.srn }}</strong>
        </div>
        <div>
            <span style="color: var(--text-grey); font-weight: 600; display: inline-block; width: 100px;">Email:</span> 
            {{ user.email }}
        </div>
        <div>
            <span style="color: var(--text-grey); font-weight: 600; display: inline-block; width: 100px;">Role:</span> 
            <span style="background-color: var(--primary-red); color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.9rem; font-weight: bold;">
                {{ user.get_role_display }}
            </span>
        </div>
        <div>
            <span style="color: var(--text-grey); font-weight: 600; display: inline-block; width: 100px;">Joined:</span> 
            {{ user.date_joined|date:"M d, Y" }}
        </div>
    </div>
</div>
{% endblock %}
